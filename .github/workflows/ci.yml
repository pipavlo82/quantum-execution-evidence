name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests
        run: python -B -m unittest discover -s tests -v
      - name: Optimized tests
        run: python -B -O -m unittest discover -s tests -v
      - name: Demo
        run: python -B -m qev demo > demo.json
      - name: Mutation gate
        run: python -B -m qev mutation-check > mutations.json
      - name: Native RVR QEV profile
        run: python -B -m qev rvr-demo > rvr-demo.json
      - name: Native RVR mutation gate
        run: python -B -m qev rvr-mutation-check > rvr-mutations.json
      - name: Native ReceiptOS QEV capsule
        run: python -B -m qev receiptos-demo > receiptos-demo.json
      - name: Native TSEI QEV preservation
        run: python -B -m qev tsei-demo > tsei-demo.json
      - name: Quantum transpilation boundary
        run: python -B -m qev quantum-transpile-demo > quantum-transpile-demo.json
      - name: Provider execution binding
        run: python -B -m qev provider-binding-demo > provider-binding-demo.json
      - name: IBM Runtime adapter
        run: python -B -m qev ibm-runtime-demo > ibm-runtime-demo.json
      - name: Source lock
        run: python -B -m qev sources > sources.json
      - name: Offline live capture replay and source mutations
        run: |
          python -B -m qev live-demo > live-export.json
          python -B -m qev live-demo > live-export-repeat.json
          python -B -O -m qev live-demo > live-export-optimized.json
          cmp live-export.json live-export-repeat.json
          cmp live-export.json live-export-optimized.json
          python -B -m qev live-replay live-export.json > live-replay.json
          python -B -m qev live-replay live-export.json > live-replay-repeat.json
          python -B -O -m qev live-replay live-export.json > live-replay-optimized.json
          cmp live-replay.json live-replay-repeat.json
          cmp live-replay.json live-replay-optimized.json
          python -B -m qev live-mutation-check > live-mutations.json
          python -B -m qev live-mutation-check > live-mutations-repeat.json
          python -B -O -m qev live-mutation-check > live-mutations-optimized.json
          cmp live-mutations.json live-mutations-repeat.json
          cmp live-mutations.json live-mutations-optimized.json
      - name: Offline Moth capture replay and semantic mutations
        run: |
          python -B -m qev.moth_replay > moth-replay.json
          python -B -m qev.moth_replay > moth-replay-repeat.json
          python -B -O -m qev.moth_replay > moth-replay-optimized.json
          cmp moth-replay.json moth-replay-repeat.json
          cmp moth-replay.json moth-replay-optimized.json
          python -B -m qev.moth_mutations > moth-mutations.json
          python -B -m qev.moth_mutations > moth-mutations-repeat.json
          python -B -O -m qev.moth_mutations > moth-mutations-optimized.json
          cmp moth-mutations.json moth-mutations-repeat.json
          cmp moth-mutations.json moth-mutations-optimized.json
      - name: Cross-provider evidence projection, replay and mutations
        run: |
          python -B -m qev.cross_cli sources
          for provider in ibm-direct moth-comet; do
            python -B -m qev.cross_cli demo --provider "$provider" > "cross-$provider.json"
            python -B -m qev.cross_cli demo --provider "$provider" > "cross-$provider-repeat.json"
            python -B -O -m qev.cross_cli demo --provider "$provider" > "cross-$provider-optimized.json"
            cmp "cross-$provider.json" "cross-$provider-repeat.json"
            cmp "cross-$provider.json" "cross-$provider-optimized.json"
            python -B -m qev.cross_cli replay --provider "$provider" --artifact "cross-$provider.json" > "cross-$provider-replay.json"
            python -B -m qev.cross_cli replay --provider "$provider" --artifact "cross-$provider.json" > "cross-$provider-replay-repeat.json"
            python -B -O -m qev.cross_cli replay --provider "$provider" --artifact "cross-$provider.json" > "cross-$provider-replay-optimized.json"
            cmp "cross-$provider-replay.json" "cross-$provider-replay-repeat.json"
            cmp "cross-$provider-replay.json" "cross-$provider-replay-optimized.json"
          done
          python -B -m qev.cross_mutations > cross-mutations.json
          python -B -m qev.cross_mutations > cross-mutations-repeat.json
          python -B -O -m qev.cross_mutations > cross-mutations-optimized.json
          cmp cross-mutations.json cross-mutations-repeat.json
          cmp cross-mutations.json cross-mutations-optimized.json
      - name: Native Moth counts RVR replay and mutations
        run: |
          python -B -m qev.moth_rvr_cli sources
          python -B -m qev.moth_rvr_cli demo --output moth-rvr.json
          python -B -m qev.moth_rvr_cli demo --output moth-rvr-repeat.json
          python -B -O -m qev.moth_rvr_cli demo --output moth-rvr-optimized.json
          cmp moth-rvr.json moth-rvr-repeat.json
          cmp moth-rvr.json moth-rvr-optimized.json
          python -B -m qev.moth_rvr_cli replay --artifact moth-rvr.json --claim profiles/rvr-qev-moth-counts-v0/claim.json > moth-rvr-replay.json
          python -B -m qev.moth_rvr_cli replay --artifact moth-rvr.json --claim profiles/rvr-qev-moth-counts-v0/claim.json > moth-rvr-replay-repeat.json
          python -B -O -m qev.moth_rvr_cli replay --artifact moth-rvr.json --claim profiles/rvr-qev-moth-counts-v0/claim.json > moth-rvr-replay-optimized.json
          cmp moth-rvr-replay.json moth-rvr-replay-repeat.json
          cmp moth-rvr-replay.json moth-rvr-replay-optimized.json
          python -B -m qev.moth_rvr_mutations > moth-rvr-mutations.json
          python -B -m qev.moth_rvr_mutations > moth-rvr-mutations-repeat.json
          python -B -O -m qev.moth_rvr_mutations > moth-rvr-mutations-optimized.json
          cmp moth-rvr-mutations.json moth-rvr-mutations-repeat.json
          cmp moth-rvr-mutations.json moth-rvr-mutations-optimized.json
      - name: Native Moth ReceiptOS export, replay and mutations
        run: |
          python -B -m qev.moth_receiptos_cli sources
          python -B -m qev.moth_receiptos_cli demo --output moth-portable.json
          python -B -m qev.moth_receiptos_cli demo --output moth-portable-repeat.json
          python -B -O -m qev.moth_receiptos_cli demo --output moth-portable-optimized.json
          cmp moth-portable.json moth-portable-repeat.json
          cmp moth-portable.json moth-portable-optimized.json
          python -B -m qev.moth_receiptos_cli export --bundle moth-rvr.json --claim profiles/rvr-qev-moth-counts-v0/claim.json --output moth-portable-custom.json
          cmp moth-portable.json moth-portable-custom.json
          python -B -m qev.moth_receiptos_cli replay --artifact moth-portable.json --claim profiles/rvr-qev-moth-counts-v0/claim.json > moth-portable-replay.json
          python -B -m qev.moth_receiptos_cli replay --artifact moth-portable.json --claim profiles/rvr-qev-moth-counts-v0/claim.json > moth-portable-replay-repeat.json
          python -B -O -m qev.moth_receiptos_cli replay --artifact moth-portable.json --claim profiles/rvr-qev-moth-counts-v0/claim.json > moth-portable-replay-optimized.json
          cmp moth-portable-replay.json moth-portable-replay-repeat.json
          cmp moth-portable-replay.json moth-portable-replay-optimized.json
          python -B -m qev.moth_receiptos_mutations > moth-portable-mutations.json
          python -B -m qev.moth_receiptos_mutations > moth-portable-mutations-repeat.json
          python -B -O -m qev.moth_receiptos_mutations > moth-portable-mutations-optimized.json
          cmp moth-portable-mutations.json moth-portable-mutations-repeat.json
          cmp moth-portable-mutations.json moth-portable-mutations-optimized.json
      - name: Documentation consistency
        run: python -B -m tools.check_docs
      - name: Diff hygiene
        run: git diff --check
